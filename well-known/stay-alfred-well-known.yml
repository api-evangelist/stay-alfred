name: Stay Alfred well-known + contract discovery probe
description: >-
  Negative probe record for Stay Alfred. Stay Alfred Inc. permanently ceased operations on
  2020-05-20 after COVID-19 travel collapse wiped out its short-term-rental demand and a
  committed funding round was withdrawn. Its former host stayalfred.com is still on the
  original 2013 registration but the registrant is now shielded behind Domains By Proxy, the
  nameservers were moved to Cloudflare, and the host no longer serves any Stay Alfred content:
  every path returns a Cloudflare 301 into a rotating chain of unrelated third-party domains
  (loganantiquemall.net, masonjarbrewing.com, northeastseafood.com, harvestkaplankaya.com).
  No /.well-known/ path, no spec path and no docs path resolves to a document. No WellKnown,
  SecurityTxt, AgentCard, LLMsTxt or OpenAPI pointer is emitted from this probe, and none
  should ever be emitted from it in a later round.

