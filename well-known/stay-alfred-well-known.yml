  note: >-
    The registration predates the shutdown (2013) and was not dropped, but the domain has been
    repointed: Cloudflare-hosted, privacy-shielded, and configured as a bulk redirector. A single
    GET of the root returns HTTP 301 with Location pointing at an unrelated business site, and the
    target ROTATES between requests, which is the signature of expired-traffic monetization rather
    than a company web presence.

