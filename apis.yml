x-secondary-market-listing-note: >-
  The Forge Global page is the harvest source for this repo, not a company web presence. It
  answers HTTP 403 (Cloudflare interstitial) to every non-browser client. Per roadmap#56 a
  trading-venue listing is not wired as a Website pointer, because a live 200 from a venue would
  earn discoverability credit the defunct company does not have.
