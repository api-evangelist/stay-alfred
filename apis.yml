x-domain-status: repointed
x-domain-note: >-
  stayalfred.com retains its original 2013-01-05 registration and has not been dropped, but the
  registrant is now shielded behind Domains By Proxy, the nameservers were moved to Cloudflare,
  and the host serves no Stay Alfred content. Every path — including /openapi.json and every
  /.well-known/ path — returns a Cloudflare HTTP 301 whose Location ROTATES between unrelated
  business sites (loganantiquemall.net, masonjarbrewing.com, northeastseafood.com,
  harvestkaplankaya.com). The only 200 on the host is /robots.txt, which is Cloudflare's default
  Content-Signals boilerplate served by the edge. See well-known/stay-alfred-well-known.yml. It
  is NOT the Stay Alfred company site and is deliberately not wired as a Website pointer.
