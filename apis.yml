aid: stay-alfred
name: Stay Alfred
description: >-
  Stay Alfred Inc. was a Spokane, Washington short-term-rental and hospitality operator that
  pioneered the "travel apartment" — full apartments in walkable downtown cores, leased in bulk
  from multifamily building owners and operated with hotel-style consistency, cleaning and
  guest support. Founded in 2011 by Jordan Allen, who was named EY Entrepreneur Of The Year for
  the Pacific Northwest in 2019, the company grew to roughly 2,000-2,500 units across 28 to 33
  U.S. markets including Denver, San Diego, Miami, New Orleans and Nashville, hosted around half
  a million guests, and employed more than 230 people. It raised approximately $62M in total
  venture funding, headlined by a $47M Series B in October 2018 led by Chicago real-estate
  technology fund Nine Four Ventures. Distribution ran through its own consumer booking site and
  the major online travel agencies, so Stay Alfred was an API CONSUMER rather than an API
  publisher; it never operated a developer program, public API, SDK, webhook catalog or
  machine-readable specification. COVID-19 ended it: the company closed every property
  nationwide from 1 April 2020, a rescue funding round was withdrawn at the last minute, and on
  20 May 2020 Stay Alfred announced it would close permanently, winding down through mid-2020
  while it had been on track for roughly $100M in revenue that year. The stayalfred.com domain
  is still on its original 2013 registration but is no longer controlled by the company: it is
  privacy-shielded, Cloudflare-hosted, and every path now 301-redirects into a rotating chain of
  unrelated third-party sites. This profile is retained as a historical record; there is no API
  surface to enrich.
